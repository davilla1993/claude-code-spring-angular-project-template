@if (page().totalPages > 1) {
  <nav class="pagination" aria-label="Pagination">
    <button type="button" class="btn btn--secondary btn--sm" [disabled]="!hasPrevious()"
            (click)="pageChange.emit(page().page - 1)">
      Précédent
    </button>
    <span aria-current="page">Page {{ page().page + 1 }} sur {{ page().totalPages }}</span>
    <button type="button" class="btn btn--secondary btn--sm" [disabled]="!hasNext()"
            (click)="pageChange.emit(page().page + 1)">
      Suivant
    </button>
  </nav>
}
<p class="muted pagination__total">{{ page().totalElements }} résultat(s)</p>
