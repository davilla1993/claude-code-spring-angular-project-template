<section class="card auth-card" aria-labelledby="forgot-title">
  <h1 id="forgot-title">Mot de passe oublié</h1>
  <p class="muted">Indiquez votre adresse email : nous vous enverrons un code pour définir un nouveau mot de passe.</p>

  @if (error(); as message) {
    <div class="alert alert--error" role="alert"><p>{{ message }}</p></div>
  }

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="forgot-email">Adresse email</label>
      @let emailError = form.controls.email | fieldError;
      <input id="forgot-email" class="input" type="email" formControlName="email" autocomplete="email"
             [attr.aria-invalid]="!!emailError" [attr.aria-describedby]="emailError ? 'forgot-email-error' : null" />
      @if (emailError) {
        <p id="forgot-email-error" class="field-error">{{ emailError }}</p>
      }
    </div>

    <button type="submit" class="btn btn--block" [disabled]="submitting()">
      {{ submitting() ? 'Envoi…' : 'Recevoir un code' }}
    </button>
  </form>

  <p><a routerLink="/auth/login">Retour à la connexion</a></p>
</section>
