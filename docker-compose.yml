# Infrastructure de développement local : PostgreSQL + MailHog (capture des emails).

services:
  db:
    image: postgres:15-alpine
    container_name: project-db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-project_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    container_name: project-mailhog
    restart: always
    ports:
      - "${MAIL_PORT:-1025}:1025" # SMTP
      - "${MAILHOG_HTTP_PORT:-8025}:8025" # Interface web : http://localhost:8025

volumes:
  postgres_data:
