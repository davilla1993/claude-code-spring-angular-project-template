spring:
  application:
    name: quantly-api

  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quantly_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:toor}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        ddl-auto: update
        jdbc.lob.non_contextual_creation: true
        tenant_identifier_resolver: com.gfolly.quantly_backend.infrastructure.multitenant.CurrentTenantIdentifierResolverImpl

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Use SSL if port is 465
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false
#  mail:
#    host: localhost
#    port: 1025
#    username:
#    password:
#    properties:
#      mail:
#        smtp:
#          auth: false
#          starttls:
#            enable: false

# Server Configuration
server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /
  forward-headers-strategy: native # Respecte X-Forwarded-Proto



# Application Configuration
app:
  mode: ${APP_MODE:saas}

  server-url: ${APP_SERVER_URL:http://localhost:8080}
  base-url: ${APP_BASE_URL:https://app.qentox.com} # Frontend URL for QR code generation
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.qentox.com,http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:2+sii8EWu2eY6sTEonNYHXlJxsvQKuSwP9SZZLOoyP7KgzD1VomLjom7HPQMGhjx1F1aYtpH5hY2MK1H/jDVwg}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000} # 24 hours in milliseconds
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days in milliseconds

  email:
    from: ${MAIL_FROM:noreply@qentox.com}
    from-name: ${MAIL_FROM_NAME:Qentox}
    verification-url: ${EMAIL_VERIFICATION_URL:https://app.qentox.com/verify-email}
    reset-password-url: ${EMAIL_RESET_PASSWORD_URL:https://app.qentox.com/reset-password}

  security:
    cookie-secure: ${COOKIE_SECURE_ENABLED:false}
    hsts:
      enabled: ${HSTS_ENABLED:true}
    rate-limit:
      login-capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
      login-duration-minutes: ${RATE_LIMIT_LOGIN_DURATION:15}

  uploads-dir: ${UPLOADS_DIR:./uploads}

  system:
    # Slug du tenant SYSTEM (créé par docs/init.sql) exclu des listes/stats COMMANDER.
    # Doit correspondre exactement au slug réel de ce tenant en base.
    tenant-slug: ${SYSTEM_TENANT_SLUG:system}

  storage:
    # "local"  → LocalFileStorageAdapter  (fichiers sur disque, servis via /uploads/**)
    # "minio"  → MinioStorageAdapter      (objet storage compatible S3 — TODO: implémenter)
    provider: ${STORAGE_PROVIDER:local}
    # minio:
    #   endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
    #   access-key: ${MINIO_ACCESS_KEY:minioadmin}
    #   secret-key: ${MINIO_SECRET_KEY:minioadmin}
    #   bucket:     ${MINIO_BUCKET:quantly-uploads}

logging:
  level:
    root: INFO
    com.gfolly.quantly_backend: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Audit Log Retention Configuration
audit:
  retention:
    days: 90 # Keep audit logs for 90 days in database
    cron: "0 0 3 * * SUN" # Run every Sunday at 3:00 AM
  archive:
    enabled: true # Archive logs to CSV before deletion
    path: "archives/audit-logs" # Path where archives will be stored

