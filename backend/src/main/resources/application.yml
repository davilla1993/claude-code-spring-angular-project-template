spring:
  application:
    name: backend-template

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/template_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        tenant_identifier_resolver: com.gfolly.backend.infrastructure.multitenant.CurrentTenantIdentifierResolverImpl

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-that-should-be-changed-in-production-and-is-quite-long}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

  email:
    from: ${MAIL_FROM:noreply@template.com}
    from-name: ${MAIL_FROM_NAME:TemplateApp}
    verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:4200/verify-email}
    reset-password-url: ${EMAIL_RESET_PASSWORD_URL:http://localhost:4200/reset-password}

  uploads-dir: ${UPLOADS_DIR:./uploads}

  storage:
    provider: ${STORAGE_PROVIDER:local}

logging:
  level:
    root: INFO
    com.gfolly.backend: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
