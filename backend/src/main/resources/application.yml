# Configuration commune à tous les environnements. Aucun identifiant ni secret ici.
# Profils : "dev" (poste local, valeurs en clair) et "prod" (variables d'environnement obligatoires).
# Aucun profil par défaut : sans profil, le démarrage échoue (secret JWT absent) plutôt que de tourner mal configuré.
spring:
  application:
    name: backend-template

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

app:
  jwt:
    access-token-expiration: 900000       # 15 minutes
    refresh-token-expiration: 604800000   # 7 jours

  security:
    cookie-secure: true
    registration-enabled: true
    token-cleanup-cron: "0 0 3 * * *"

  storage:
    allowed-extensions: jpg,jpeg,png,gif,webp,pdf

logging:
  level:
    root: INFO
    com.gfolly.backend: INFO
