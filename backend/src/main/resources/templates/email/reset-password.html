<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Réinitialisation de votre mot de passe</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
<p>Bonjour <span th:text="${firstName}">Prénom</span>,</p>
<p>Voici votre code de réinitialisation du mot de passe <span th:text="${appName}">Application</span> :</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px;" th:text="${code}">000000</p>
<p>Ce code expire dans 15 minutes.</p>
<p>Si vous n'avez pas demandé de réinitialisation, ignorez cet email : votre mot de passe reste inchangé.</p>
</body>
</html>
